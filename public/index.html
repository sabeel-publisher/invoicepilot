<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InvoicePilot — AI invoicing agent for freelancers</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0b1020; color: #e8ecf8; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; margin-bottom: 4px; }
  .sub { color: #9fb0d8; margin-top: 0; }
  .card { background: #141b36; border: 1px solid #26305c; border-radius: 14px; padding: 20px; margin: 18px 0; }
  textarea, input { width: 100%; box-sizing: border-box; background: #0b1020; color: #e8ecf8; border: 1px solid #33407a; border-radius: 8px; padding: 10px; }
  button { background: #0070e0; color: white; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
  button.secondary { background: #26305c; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px; border-bottom: 1px solid #26305c; text-align: left; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #26305c; }
  .pill.PAID { background: #14532d; } .pill.UNPAID { background: #7c2d12; } .pill.DRAFT { background: #33407a; }
  pre { white-space: pre-wrap; background: #0b1020; padding: 12px; border-radius: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; } .row > * { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>🧾 InvoicePilot</h1>
  <p class="sub">Describe the work in plain English. The AI drafts the invoice, PayPal sends it, and the agent chases it politely until it's paid.</p>

  <div class="card">
    <label><strong>What did you do?</strong></label>
    <textarea id="desc" rows="3" placeholder="e.g. Logo design for Maria's bakery, $450, due Friday — or: 6 hours of consulting at $80/hr for Acme Corp"></textarea>
    <div class="row" style="margin-top:10px">
      <input id="email" type="email" placeholder="Client email (for the PayPal invoice)" />
      <button id="draftBtn">✨ Draft with AI</button>
    </div>
    <div id="draftBox"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Dashboard</h3>
    <div id="summary">Loading…</div>
    <table><thead><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script>
let currentDraft = null;
const $ = (id) => document.getElementById(id);

$('draftBtn').onclick = async () => {
  const r = await fetch('/api/draft', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: $('desc').value }) });
  const { draft, error } = await r.json();
  if (error) { $('draftBox').innerHTML = '<pre>' + error + '</pre>'; return; }
  currentDraft = draft;
  $('draftBox').innerHTML = '<pre>' + JSON.stringify(draft, null, 2) + '</pre>' +
    '<button id="sendBtn">Send via PayPal →</button>';
  $('sendBtn').onclick = async () => {
    const r2 = await fetch('/api/invoices', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ draft: currentDraft, clientEmail: $('email').value || undefined }) });
    const out = await r2.json();
    if (out.error) { alert(out.error); return; }
    alert('Invoice ' + out.invoice.id + ' sent! Payer link: ' + out.payerLink);
    load();
  };
};

async function load() {
  const r = await fetch('/api/invoices');
  const { summary, invoices } = await r.json();
  $('summary').textContent = `${summary.total} invoices · ${summary.paid} paid ($${summary.paidValue}) · $${summary.outstandingValue} outstanding · ${summary.overdue} overdue`;
  $('rows').innerHTML = invoices.map(inv => {
    const client = inv.primary_recipients?.[0]?.billing_info?.name?.given_name || '';
    return `<tr><td>${inv.detail?.invoice_number || inv.id}</td><td>${client}</td><td>${inv.amount?.currency_code || ''} ${inv.amount?.value || ''}</td><td>${inv.detail?.payment_term?.due_date || ''}</td><td><span class="pill ${inv.status}">${inv.status}</span></td>
    <td>${inv.status === 'UNPAID' ? `<button class="secondary" onclick="pay('${inv.id}')">Simulate payment</button>` : ''} <button class="secondary" onclick="followUp('${inv.id}')">Follow-up draft</button></td></tr>`;
  }).join('');
}
async function pay(id) { await fetch(`/api/invoices/${id}/pay`, { method: 'POST' }); load(); }
async function followUp(id) {
  const r = await fetch(`/api/invoices/${id}/follow-up`);
  const { followUp } = await r.json();
  alert(followUp.subject + '\n\n' + followUp.body);
}
load();
</script>
</body>
</html>
